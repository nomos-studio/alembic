# alembic CI — Clojure test suite
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  clojure:
    name: Clojure tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          path: alembic
      - uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-maths
          path: nomos-maths
      - uses: actions/checkout@v4
        with:
          repository: nomos-studio/nomos-topology
          path: nomos-topology
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('alembic/project.clj', 'nomos-maths/project.clj', 'nomos-topology/project.clj') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          lein: latest
      - name: Install Faust (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y faust
      - name: Install Faust (macOS)
        if: runner.os == 'macOS'
        run: brew install faust
      - name: Install nomos-maths
        run: lein install
        working-directory: nomos-maths
      - name: Install nomos-topology
        run: lein install
        working-directory: nomos-topology
      - name: Run test suite
        run: lein test
        working-directory: alembic
